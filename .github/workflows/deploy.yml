# Builds the static game and publishes it to GitHub Pages on every push to main.
# URL: https://<user>.github.io/<repo>/   (set Settings → Pages → Source = "GitHub Actions" once)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (sub-path = repo name, unless this is the <user>.github.io repo)
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) export NEXT_PUBLIC_BASE_PATH="" ;;
            *)           export NEXT_PUBLIC_BASE_PATH="/$REPO" ;;
          esac
          echo "base path: '$NEXT_PUBLIC_BASE_PATH'"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
